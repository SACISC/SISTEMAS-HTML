<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SACISC · Resumen del Área</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --verde-osc:#1e5b4f; --verde-med:#2d9e7e; --verde-cla:#11CD78;
      --naranja:#e67e22; --azul:#1565c0; --rojo:#c0392b; --border:#e0e8e4;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:'Inter',sans-serif;
      background:#0d2137;color:#333;
      min-height:100vh;display:flex;
      flex-direction:column;align-items:center;justify-content:center;padding:20px;
    }
    #pantallaEspera{text-align:center;color:#fff;}
    .logo-wrap{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:28px;}
    .logo-icon{width:56px;height:56px;background:linear-gradient(135deg,var(--verde-osc),var(--verde-med));border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;}
    h1{font-family:'Barlow Condensed',sans-serif;font-size:2rem;font-weight:900;letter-spacing:0.06em;text-transform:uppercase;}
    .sub{font-size:0.82rem;color:rgba(255,255,255,0.5);margin-top:4px;}
    #barraProgreso{width:320px;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden;margin:24px auto 12px;}
    #barraProgreso .fill{height:100%;background:linear-gradient(90deg,var(--verde-med),var(--verde-cla));border-radius:3px;transition:width 0.4s;width:0%;}
    #msgProgreso{font-size:0.78rem;color:rgba(255,255,255,0.6);}
    #btnDescargar,#btnCerrar{display:none;margin-top:12px;}
    #btnDescargar{background:linear-gradient(135deg,var(--verde-osc),var(--verde-med));color:#fff;border:none;border-radius:10px;padding:12px 28px;font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;}
    #btnCerrar{background:transparent;color:rgba(255,255,255,0.4);border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:8px 20px;font-size:0.78rem;cursor:pointer;}
    #renderWrap{position:fixed;top:0;left:0;width:816px;opacity:0;pointer-events:none;z-index:-1;background:#fff;}

    /* ── Estilos del documento ── */
    .rpt-page{width:816px;background:#fff;font-family:'Inter',sans-serif;padding:36px 40px 28px;}
    .rpt-header{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:14px;border-bottom:3px solid var(--verde-med);margin-bottom:20px;}
    .rpt-header-left{display:flex;align-items:center;gap:16px;}
    .rpt-header-logo img{height:56px;width:auto;object-fit:contain;display:block;}
    .rpt-header-org .org-name{font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:900;color:var(--verde-osc);text-transform:uppercase;letter-spacing:0.05em;}
    .rpt-header-org .org-sub{font-size:0.7rem;color:#888;margin-top:2px;}
    .rpt-header-org .rpt-titulo{font-size:0.78rem;font-weight:700;color:var(--verde-med);margin-top:4px;text-transform:uppercase;letter-spacing:0.04em;}
    .rpt-header-right{text-align:right;}
    .rpt-folio{font-family:'Barlow Condensed',sans-serif;font-size:0.88rem;font-weight:900;color:var(--verde-osc);letter-spacing:0.06em;}
    .rpt-fecha{font-size:0.68rem;color:#aaa;margin-top:3px;}
    .rpt-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px;}
    .rpt-kpi{background:#f8fbf9;border:1.5px solid var(--border);border-radius:10px;padding:12px;position:relative;overflow:hidden;}
    .rpt-kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
    .rpt-kpi-label{font-size:0.58rem;text-transform:uppercase;letter-spacing:0.07em;color:#888;font-weight:700;margin-bottom:5px;}
    .rpt-kpi-val{font-family:'Barlow Condensed',sans-serif;font-size:1.4rem;font-weight:900;line-height:1.1;}
    .rpt-kpi-val .u{font-size:0.7rem;font-weight:600;}
    .rpt-kpi-sub{font-size:0.58rem;color:#aaa;margin-top:2px;}
    .sec-title{font-family:'Barlow Condensed',sans-serif;font-size:0.82rem;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;color:var(--verde-osc);display:flex;align-items:center;gap:6px;margin-bottom:10px;}
    .sec-title::after{content:'';flex:1;height:1px;background:var(--border);}
    .rpt-table{width:100%;border-collapse:collapse;font-size:0.7rem;}
    .rpt-table thead tr{background:var(--verde-osc);}
    .rpt-table thead th{color:#fff;padding:8px 8px;font-family:'Barlow Condensed',sans-serif;font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;white-space:nowrap;}
    .rpt-table thead th.r{text-align:right;}
    .rpt-table thead th.c{text-align:center;}
    .rpt-table tbody tr:nth-child(even){background:#f8fbf9;}
    .rpt-table tbody tr:hover{background:#eaf3f0;}
    .rpt-table tbody td{padding:7px 8px;border-bottom:1px solid var(--border);color:#444;}
    .rpt-table tbody td.r{text-align:right;font-variant-numeric:tabular-nums;}
    .rpt-table tbody td.c{text-align:center;}
    .rpt-table tfoot td{padding:8px 8px;background:#e8f5f0;font-weight:800;color:var(--verde-osc);border-top:2px solid var(--verde-med);}
    .rpt-table tfoot td.r{text-align:right;}
    .tag{display:inline-block;border-radius:4px;padding:1px 7px;font-size:0.62rem;font-weight:700;}
    .tag.magna{background:#e8f5e9;color:#2e7d32;}
    .tag.diesel{background:#e3f2fd;color:#1565c0;}
    .pct-bar-wrap{width:50px;height:6px;background:#e0e0e0;border-radius:3px;display:inline-block;vertical-align:middle;margin-right:4px;}
    .rpt-footer{border-top:1px solid var(--border);padding-top:10px;margin-top:16px;display:flex;justify-content:space-between;align-items:center;}
    .rpt-footer-l{font-size:0.6rem;color:#aaa;}
    .rpt-footer-r{font-size:0.6rem;color:#bbb;font-style:italic;}
  </style>
</head>
<body>

<div id="pantallaEspera">
  <div class="logo-wrap">
    <div class="logo-icon">📊</div>
    <div>

      <div class="sub">SACISC · Módulo Combustibles · PEMEX URCS Sur</div>
    </div>
  </div>
  <div id="barraProgreso"><div class="fill" id="fillBar"></div></div>
  <div id="msgProgreso">Leyendo datos…</div>
  <button id="btnDescargar" onclick="descargarPDF()">⬇ Descargar PDF</button>
  <button id="btnCerrar" onclick="window.close()">Cerrar ventana</button>
</div>

const fmt  = n => Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:1,maximumFractionDigits:1});
const fmtI = n => Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:0});
const MESES_N = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const EST_NOM = {'7394':'Los Cocos','9602':'Gavilán','9851':'El Graham','10885':'Las Choapas'};

function setProgreso(pct, msg) {
  document.getElementById('fillBar').style.width = pct+'%';
  document.getElementById('msgProgreso').textContent = msg;
}

let pdfBlob = null;
let DATOS   = null;

window.addEventListener('load', async () => {
  try {
    const raw = localStorage.getItem('SACISC_RESUMEN_AREA');
    if (!raw) { setProgreso(0,'❌ Sin datos. Abra desde el sistema SACISC.'); return; }
    DATOS = JSON.parse(raw);
    setProgreso(10,'Construyendo resumen…');
    await new Promise(r => setTimeout(r,200));
    await generarPDF();
  } catch(e) { setProgreso(0,'❌ Error: '+e.message); console.error(e); }
});

function buildResumen(now) {
  const tarjetas  = DATOS.tarjetas;
  const mes       = DATOS.mes;
  const anio      = DATOS.anio;
  const area      = DATOS.area || 'General';
  const folio     = 'RSM-'+anio+String(mes).padStart(2,'0')+'-'+now.getTime().toString().slice(-4);
  const mesNombre = MESES_N[mes]||'';

  // Totales
  const totalMagna  = tarjetas.reduce((s,b)=>s+b.rows.filter(r=>r.producto==='MAGNA').reduce((a,r)=>a+(r.litros||0),0),0);
  const totalDiesel = tarjetas.reduce((s,b)=>s+b.rows.filter(r=>r.producto==='DIESEL').reduce((a,r)=>a+(r.litros||0),0),0);
  const totalKm     = tarjetas.reduce((s,b)=>s+b.rows.reduce((a,r)=>a+(r.distancia||0),0),0);
  const totalCargas = tarjetas.reduce((s,b)=>s+b.rows.length,0);
  const totalLitros = totalMagna+totalDiesel;
  const totalAut    = tarjetas.reduce((s,b)=>s+(b.montoAutorizado||0),0);
  const pctGlobal   = totalAut>0?(totalLitros/totalAut*100):null;
  const pctGCol     = pctGlobal===null?'#888':pctGlobal>100?'#1e5b4f':pctGlobal>=80?'#e67e22':'#27ae60';

  const kpis = [
    {l:'Tarjetas',      v:String(tarjetas.length), u:'',   c:'#1e5b4f', s:'en el área'},
    {l:'Total cargas',  v:fmtI(totalCargas),       u:'',   c:'#555',    s:'transacciones'},
    {l:'MAGNA',         v:fmt(totalMagna),          u:' L', c:'#2e7d32', s:'consumo'},
    {l:'DIESEL',        v:fmt(totalDiesel),         u:' L', c:'#1565c0', s:'consumo'},
    {l:'Total general', v:fmt(totalLitros),         u:' L', c:'#1e5b4f', s:pctGlobal!==null?pctGlobal.toFixed(1)+'% del autorizado':''},
  ].map(k=>`<div class="rpt-kpi" style="--kc:${k.c}">
    <div class="rpt-kpi::before" style="background:${k.c}"></div>
    <div style="position:absolute;top:0;left:0;right:0;height:3px;background:${k.c};border-radius:10px 10px 0 0;"></div>
    <div class="rpt-kpi-label">${k.l}</div>
    <div class="rpt-kpi-val" style="color:${k.c}">${k.v}<span class="u">${k.u}</span></div>
    <div class="rpt-kpi-sub">${k.s}</div>
  </div>`).join('');

  const filas = tarjetas.map((b,i)=>{
    const litros  = b.rows.reduce((s,r)=>s+(r.litros||0),0);
    const magna   = b.rows.filter(r=>r.producto==='MAGNA').reduce((s,r)=>s+(r.litros||0),0);
    const diesel  = b.rows.filter(r=>r.producto==='DIESEL').reduce((s,r)=>s+(r.litros||0),0);
    const km      = b.rows.reduce((s,r)=>s+(r.distancia||0),0);
    const rend    = b.rows.filter(r=>r.rendimiento>0);
    const avgRend = rend.length?rend.reduce((s,r)=>s+r.rendimiento,0)/rend.length:0;
    const pct     = b.montoAutorizado>0?(litros/b.montoAutorizado*100):null;
    const pctCol  = pct===null?'#888':pct>100?'#1e5b4f':pct>=80?'#e67e22':'#27ae60';
    const pctBar  = pct!==null?Math.min(100,pct):0;
    return `<tr>
      <td class="c" style="font-weight:700;color:#1e5b4f;font-size:0.72rem;">${i+1}</td>
      <td>
        <div style="font-weight:700;font-size:0.72rem;color:#222;">${b.usuario||'—'}</div>
        <div style="font-size:0.6rem;color:#999;margin-top:1px;">${b.tarjeta} · ${b.placa||'—'}</div>
      </td>
      <td style="font-size:0.68rem;color:#555;">${b.area||'—'}</td>
      <td class="c">
        <span class="tag ${b.producto==='MAGNA'?'magna':'diesel'}">${b.producto||'—'}</span>
      </td>
      <td class="r" style="color:#2e7d32;font-weight:600;">${magna>0?fmt(magna)+' L':'—'}</td>
      <td class="r" style="color:#1565c0;font-weight:600;">${diesel>0?fmt(diesel)+' L':'—'}</td>
      <td class="r" style="font-weight:800;color:#1e5b4f;">${fmt(litros)} L</td>
      <td class="r" style="color:#666;">${km>0?fmtI(km)+' km':'—'}</td>
      <td class="r" style="color:#666;">${avgRend>0?avgRend.toFixed(2)+' km/L':'—'}</td>
      <td class="r">
        <div style="display:flex;align-items:center;justify-content:flex-end;gap:4px;">
          <div style="width:36px;height:5px;background:#e0e0e0;border-radius:3px;overflow:hidden;flex-shrink:0;">
            <div style="height:100%;width:${pctBar.toFixed(0)}%;background:${pctCol};border-radius:3px;"></div>
          </div>
          <span style="font-size:0.68rem;font-weight:700;color:${pctCol};white-space:nowrap;">
            ${pct!==null?pct.toFixed(1)+'%':'—'}
          </span>
        </div>
      </td>
      <td class="c" style="font-size:0.7rem;font-weight:600;color:#555;">${b.rows.length}</td>
    </tr>`;
  }).join('');

  return `<div class="rpt-page">
    <!-- ENCABEZADO -->
    <div class="rpt-header">
      <div class="rpt-header-left">
        <div class="rpt-header-logo">
          <img src="${LOGO_B64}" alt="PEMEX">
        </div>
        <div class="rpt-header-org">
          <div class="org-name">Petróleos Mexicanos</div>
          <div class="org-sub">Sistema Administrativo de Control Integral de Servicios Corporativos</div>
          <div class="rpt-titulo">Resumen Consolidado de Consumo de Combustible</div>
        </div>
      </div>
      <div class="rpt-header-right">
        <div class="rpt-folio">${folio}</div>
        <div class="rpt-fecha">
          Período: <strong>${mesNombre} ${anio}</strong><br>
          Área: <strong>${area}</strong><br>
          ${now.toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'})}
        </div>
      </div>
    </div>

    <!-- KPIs -->
    <div class="rpt-kpis">${kpis}</div>

    <!-- KM y TÍTULO TABLA -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <div class="sec-title" style="margin-bottom:0;flex:1;">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        Relación de Consumo por Tarjeta — ${mesNombre} ${anio}
      </div>
      <div style="background:#e8f5f0;border-radius:8px;padding:5px 12px;margin-left:12px;
        font-size:0.7rem;color:#1e5b4f;font-weight:700;white-space:nowrap;flex-shrink:0;">
        Km totales: ${fmtI(totalKm)} km
      </div>
    </div>

    <!-- TABLA -->
    <div style="border-radius:10px;border:1.5px solid var(--border);overflow:hidden;margin-bottom:16px;">
      <table class="rpt-table">
        <thead><tr>
          <th class="c">#</th>
          <th>Usuario / Tarjeta</th>
          <th>Área</th>
          <th class="c">Prod.</th>
          <th class="r">Magna</th>
          <th class="r">Diesel</th>
          <th class="r">Total L</th>
          <th class="r">Km</th>
          <th class="r">Rend.</th>

async function generarPDF() {
  const {jsPDF} = window.jspdf;
  const now  = new Date();
  const wrap = document.getElementById('renderWrap');
  const pdf  = new jsPDF({orientation:'portrait',unit:'px',format:'letter',hotfixes:['px_scaling']});
  const PW   = pdf.internal.pageSize.getWidth();
  const PH   = pdf.internal.pageSize.getHeight();

  setProgreso(30,'Renderizando resumen…');
  wrap.innerHTML = buildResumen(now);
  await new Promise(r=>setTimeout(r,300));

  const el     = wrap.firstElementChild;
  const canvas = await html2canvas(el,{scale:2,useCORS:true,allowTaint:false,backgroundColor:'#ffffff',logging:false,width:816});
  wrap.innerHTML = '';

  const imgW = PW;
  const imgH = canvas.height*(PW/canvas.width);

  if (imgH<=PH) {
    pdf.addImage(canvas.toDataURL('image/jpeg',0.95),'JPEG',0,0,imgW,imgH);
  } else {
    let posY=0;
    while(posY<canvas.height) {
      const sliceH=Math.min(Math.ceil(canvas.height*PH/imgH),canvas.height-posY);
      const sc=document.createElement('canvas');
      sc.width=canvas.width; sc.height=sliceH;
      sc.getContext('2d').drawImage(canvas,0,posY,canvas.width,sliceH,0,0,canvas.width,sliceH);
      if(posY>0) pdf.addPage();
      pdf.addImage(sc.toDataURL('image/jpeg',0.95),'JPEG',0,0,imgW,sliceH*(PW/canvas.width));
      posY+=sliceH;
    }
  }

  setProgreso(100,'✅ Resumen generado');
  pdfBlob = pdf.output('blob');

  const area   = (DATOS.area||'Area').replace(/\s+/g,'_');
  const mesN   = MESES_N[DATOS.mes]||DATOS.mes;
  const nombre = `Resumen_${area}_${mesN}_${DATOS.anio}.pdf`;
  const url    = URL.createObjectURL(pdfBlob);
  const a      = document.createElement('a');
  a.href=url; a.download=nombre;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  localStorage.removeItem('SACISC_RESUMEN_AREA');

  document.getElementById('btnDescargar').style.display='inline-block';
  document.getElementById('btnCerrar').style.display='inline-block';
}

function descargarPDF() {
  if(!pdfBlob) return;
  const area=(DATOS?.area||'Area').replace(/\s+/g,'_');
  const url=URL.createObjectURL(pdfBlob);
  const a=document.createElement('a');
  a.href=url; a.download=`Resumen_${area}_${MESES_N[DATOS?.mes]||''}_${DATOS?.anio||''}.pdf`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}
