<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SACISC · Super Reporte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --verde-osc: #1e5b4f;
      --verde-med: #2d9e7e;
      --verde-cla: #11CD78;
      --naranja:   #e67e22;
      --azul:      #1565c0;
      --rojo:      #c0392b;
      --gris:      #555;
      --border:    #e0e8e4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0d2137;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ── Pantalla de espera ── */
    #pantallaEspera {
      text-align: center;
      color: #fff;
    }
    #pantallaEspera .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 28px;
    }
    #pantallaEspera .logo-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--verde-osc), var(--verde-med));
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem;
    }
    #pantallaEspera h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2rem; font-weight: 900;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    #pantallaEspera .sub {
      font-size: 0.82rem; color: rgba(255,255,255,0.5);
      margin-top: 4px;
    }
    #barraProgreso {
      width: 320px; height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px; overflow: hidden;
      margin: 24px auto 12px;
    }
    #barraProgreso .fill {
      height: 100%;
      background: linear-gradient(90deg, var(--verde-med), var(--verde-cla));
      border-radius: 3px;
      transition: width 0.4s ease;
      width: 0%;
    }
    #msgProgreso {
      font-size: 0.78rem; color: rgba(255,255,255,0.6);
    }
    #btnDescargar {
      display: none;
      margin-top: 24px;
      background: linear-gradient(135deg, var(--verde-osc), var(--verde-med));
      color: #fff; border: none; border-radius: 10px;
      padding: 14px 32px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem; font-weight: 800;
      letter-spacing: 0.06em; text-transform: uppercase;
      cursor: pointer;
      display: none; align-items: center; gap: 8px;
    }
    #btnDescargar:hover { opacity: 0.9; }
    #btnCerrar {
      display: none;
      margin-top: 12px;
      background: transparent;
      color: rgba(255,255,255,0.4);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px; padding: 8px 20px;
      font-size: 0.78rem; cursor: pointer;
    }

    /* ── Página del reporte (para html2canvas) ── */
    .rpt-page {
      width: 816px; /* Letter 96dpi */
      background: #fff;
      font-family: 'Inter', sans-serif;
      padding: 36px 40px 28px;
      position: relative;
    }

    /* Encabezado */
    .rpt-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-bottom: 14px;
      border-bottom: 3px solid var(--verde-med);
      margin-bottom: 18px;
    }
    .rpt-header-left {
      display: flex; align-items: center; gap: 14px;
    }
    .rpt-header-logo {
      flex-shrink: 0;
      display: flex; align-items: center;
    }
    .rpt-header-logo img {
      height: 56px; width: auto; object-fit: contain; display: block;
    }
    .rpt-header-org {
      font-family: 'Barlow Condensed', sans-serif;
    }
    .rpt-header-org .org-name {
      font-size: 1rem; font-weight: 900;
      color: var(--verde-osc); text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .rpt-header-org .org-sub {
      font-size: 0.72rem; color: #888; margin-top: 2px;
    }
    .rpt-header-org .rpt-titulo {
      font-size: 0.78rem; font-weight: 700;
      color: var(--verde-med); margin-top: 4px;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .rpt-header-right {
      text-align: right;
    }
    .rpt-folio {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.88rem; font-weight: 900;
      color: var(--verde-osc); letter-spacing: 0.06em;
    }
    .rpt-fecha {
      font-size: 0.68rem; color: #aaa; margin-top: 3px;
    }

    /* Banda usuario */
    .rpt-user-band {
      background: linear-gradient(135deg, var(--verde-osc), #2d6b5a);
      border-radius: 10px;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .rpt-user-label {
      font-size: 0.6rem; color: rgba(255,255,255,0.55);
      text-transform: uppercase; letter-spacing: 0.1em;
      margin-bottom: 4px;
    }
    .rpt-user-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.3rem; font-weight: 900;
      color: #fff; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .rpt-chips {
      display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px;
    }
    .rpt-chip {
      background: rgba(255,255,255,0.15);
      color: #fff; border-radius: 5px;
      padding: 2px 10px;
      font-size: 0.68rem; font-weight: 600;
    }
    .rpt-veh-block { text-align: right; }
    .rpt-veh-val {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.95rem; font-weight: 800;
      color: rgba(255,255,255,0.9);
    }

    /* Info vehículo */
    .rpt-veh-row {
      display: grid;
      grid-template-columns: repeat(6,1fr);
      gap: 8px;
      background: #f8fbf9;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 16px;
    }
    .rpt-veh-item .vi-label {
      font-size: 0.58rem; text-transform: uppercase;
      letter-spacing: 0.07em; color: #aaa; font-weight: 700;
    }
    .rpt-veh-item .vi-val {
      font-size: 0.78rem; font-weight: 700;
      color: var(--verde-osc); margin-top: 2px;
    }

    /* KPIs */
    .rpt-section-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.78rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--verde-osc);
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 10px;
    }
    .rpt-section-title::after {
      content: ''; flex: 1;
      height: 1px; background: var(--border);
    }
    .rpt-kpis {
      display: grid;
      grid-template-columns: repeat(6,1fr);
      gap: 8px;
      margin-bottom: 18px;
    }
    .rpt-kpi {
      border-radius: 8px;
      padding: 10px 10px 8px;
      background: #f8fbf9;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    .rpt-kpi::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 3px;
    }
    .rpt-kpi.k-verde::before  { background: var(--verde-osc); }
    .rpt-kpi.k-azul::before   { background: var(--azul); }
    .rpt-kpi.k-gris::before   { background: #888; }
    .rpt-kpi.k-naranja::before{ background: var(--naranja); }
    .rpt-kpi.k-rojo::before   { background: var(--rojo); }
    .rpt-kpi-label {
      font-size: 0.58rem; text-transform: uppercase;
      letter-spacing: 0.06em; color: #888; font-weight: 700;
      margin-bottom: 4px;
    }
    .rpt-kpi-val {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.15rem; font-weight: 900;
      line-height: 1.1;
    }
    .rpt-kpi-val .unit {
      font-size: 0.68rem; font-weight: 600;
    }
    .rpt-kpi-sub {
      font-size: 0.58rem; color: #aaa; margin-top: 2px;
    }

    /* Gráfica rendimiento */
    .rpt-grafica-wrap {
      background: #f8fbf9;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .rpt-bars-wrap {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 80px;
      margin-bottom: 4px;
    }
    .rpt-bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      height: 100%;
      justify-content: flex-end;
    }
    .rpt-bar-val {
      font-size: 0.5rem; font-weight: 700;
      line-height: 1;
    }
    .rpt-bar {
      width: 100%;
      border-radius: 2px 2px 0 0;
      min-height: 3px;
    }
    .rpt-bar-dia {
      font-size: 0.5rem; color: #aaa;
      margin-top: 2px;
    }
    .rpt-avg-line {
      border-top: 1.5px dashed var(--verde-osc);
      padding-top: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .rpt-avg-label {
      font-size: 0.65rem; font-weight: 700;
      color: var(--verde-osc);
    }
    .rpt-legend {
      display: flex; gap: 12px; font-size: 0.6rem;
    }
    .rpt-legend span { display: flex; align-items: center; gap: 4px; }

    /* Tabla */
    .rpt-table-wrap {
      border-radius: 10px;
      border: 1.5px solid var(--border);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .rpt-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.7rem;
    }
    .rpt-table thead tr {
      background: var(--verde-osc);
    }
    .rpt-table thead th {
      color: #fff;
      padding: 8px 10px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.7rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em;
      text-align: left;
    }
    .rpt-table thead th.r { text-align: right; }
    .rpt-table tbody tr:nth-child(even) { background: #f8fbf9; }
    .rpt-table tbody td {
      padding: 6px 10px;
      border-bottom: 1px solid var(--border);
      color: #444;
    }
    .rpt-table tbody td.r { text-align: right; font-variant-numeric: tabular-nums; }
    .rpt-table tfoot td {
      padding: 7px 10px;
      background: #e8f5f0;
      font-weight: 800;
      color: var(--verde-osc);
      border-top: 2px solid var(--verde-med);
    }
    .rpt-table tfoot td.r { text-align: right; }
    .tag {
      display: inline-block;
      border-radius: 5px;
      padding: 1px 7px;
      font-size: 0.65rem;
      font-weight: 700;
    }
    .tag.magna  { background: #e8f5e9; color: #2e7d32; }
    .tag.diesel { background: #e3f2fd; color: #1565c0; }

    /* Pie de página */
    .rpt-footer {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .rpt-footer-left {
      font-size: 0.6rem; color: #aaa;
    }
    .rpt-footer-right {
      font-size: 0.6rem; color: #bbb;
      font-style: italic;
    }

    /* Contenedor de renderizado oculto */
    #renderWrap {
      position: fixed;
      top: 0; left: 0;
      opacity: 0;
      pointer-events: none;
      z-index: -1;
      width: 816px;
    }
  </style>
</head>
<body>

<!-- Pantalla de progreso -->
<div id="pantallaEspera">
  <div class="logo-wrap">
    <div class="logo-icon">📋</div>
    <div>
      <h1>Super Reporte</h1>
      <div class="sub">SACISC · Módulo Combustibles · PEMEX URCS Sur</div>
    </div>
  </div>
  <div id="barraProgreso"><div class="fill" id="fillBar"></div></div>
  <div id="msgProgreso">Leyendo datos…</div>
  <button id="btnDescargar" onclick="descargarPDF()">
    ⬇ Descargar PDF
  </button>
  <button id="btnCerrar" onclick="window.close()">Cerrar ventana</button>
</div>

<!-- Contenedor de renderizado -->
<div id="renderWrap"></div>

<script>
// ── Benchmarks (idénticos al sistema principal) ───────────────────────
const BENCHMARKS = {
  'NISSAN|FRONTIER|2021': { min:6.5, max:9.5 },
  'NISSAN|FRONTIER|2022': { min:6.5, max:9.5 },
  'NISSAN|FRONTIER|2023': { min:6.5, max:9.5 },
  'NISSAN|FRONTIER|2020': { min:6.0, max:9.0 },
  'NISSAN|FRONTIER|2019': { min:5.5, max:8.5 },
  'DODGE|RAM|2022':       { min:5.5, max:8.5 },
  'DODGE|RAM|2021':       { min:5.5, max:8.5 },
  'DODGE|RAM|2020':       { min:5.0, max:8.0 },
  'CHEVROLET|CHEYENNE|2022': { min:5.5, max:8.5 },
  'CHEVROLET|CHEYENNE|2021': { min:5.5, max:8.5 },
  'TOYOTA|HILUX|2022':    { min:7.0, max:10.0 },
  'TOYOTA|HILUX|2021':    { min:7.0, max:10.0 },
  'FORD|RANGER|2022':     { min:6.5, max:9.5 },
  'FORD|RANGER|2021':     { min:6.5, max:9.5 },
  'FORD|F-150|2022':      { min:5.0, max:8.0 },
  'FORD|F-150|2021':      { min:5.0, max:8.0 },
  'NISSAN|URVAN|2022':    { min:6.0, max:8.5 },
  'NISSAN|URVAN|2021':    { min:6.0, max:8.5 },
  'FORD|TRANSIT|2022':    { min:6.0, max:8.5 },
};
const BENCH_POR_TIPO = {
  'PICK-UP / CAMIONETA': { min:5.5, max:9.0 },
  'PICK-UP':             { min:5.5, max:9.0 },
  'PICKUP':              { min:5.5, max:9.0 },
  'CAMIONETA':           { min:5.5, max:9.0 },
  'SEMI PESADO':         { min:4.5, max:7.5 },
  'SEMIPESADO':          { min:4.5, max:7.5 },
  'SEMI-PESADO':         { min:4.5, max:7.5 },
};

function getBench(b) {
  // Intentar por marca+submarca+modelo
  const key = `${String(b.marca||'').toUpperCase()}|${String(b.subMarca||'').toUpperCase()}|${b.modelo||''}`;
  if (BENCHMARKS[key]) return BENCHMARKS[key];
  // Por tipo
  const tipo = String(b.tipoVehiculo||'').toUpperCase().trim();
  return BENCH_POR_TIPO[tipo] || null;
}

function calcCalificacion(avgRend, bench) {
  if (!bench || avgRend <= 0) return null;
  const { min, max } = bench;
  let pts = 0;
  if (avgRend >= max)       pts = 100;
  else if (avgRend >= min)  pts = Math.round(60 + (avgRend-min)/(max-min)*40);
  else if (avgRend >= min*0.8) pts = Math.round(40 + (avgRend-min*0.8)/(min-min*0.8)*20);
  else                      pts = Math.max(0, Math.round(avgRend/min*40));

  const nivel = pts>=90?'Excelente':pts>=75?'Bueno':pts>=60?'Regular':pts>=40?'Bajo':'Deficiente';
  const color = pts>=90?'#27ae60':pts>=75?'#2ecc71':pts>=60?'#e67e22':pts>=40?'#e74c3c':'#c0392b';
  return { pts, nivel, color, min, max };
}

// ── Utilidades ─────────────────────────────────────────────────────────
const fmt  = n => Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:1,maximumFractionDigits:1});
const fmtI = n => Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:0});
const MESES_N = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio',
                 'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const EST_NOM = {'7394':'Los Cocos','9602':'Gavilán','9851':'El Graham','10885':'Las Choapas'};
const PICKUP  = ['PICK-UP / CAMIONETA','PICK-UP','PICKUP','CAMIONETA',
                 'SEMI PESADO','SEMIPESADO','PICK UP','SEMI-PESADO'];

function setProgreso(pct, msg) {
  document.getElementById('fillBar').style.width = pct+'%';
  document.getElementById('msgProgreso').textContent = msg;
}

// ── Leer datos desde localStorage ──────────────────────────────────────
let DATOS = null;
let pdfBlob = null;

window.addEventListener('load', async () => {
  try {
    const raw = localStorage.getItem('SACISC_SUPER_RPT');
    if (!raw) {
      setProgreso(0,'❌ Sin datos. Abra este reporte desde el sistema SACISC.');
      return;
    }
    DATOS = JSON.parse(raw);
    setProgreso(10, `Preparando ${DATOS.tarjetas.length} tarjetas…`);
    await new Promise(r => setTimeout(r,200));
    await generarPDF();
  } catch(e) {
    setProgreso(0,'❌ Error: '+e.message);
    console.error(e);
  }
});

// ── Portada: resumen consolidado de todas las tarjetas ─────────────────
function buildPortada(tarjetas, now, LOGO_SRC) {
  const totalMagna  = tarjetas.reduce((s,b)=>s+b.rows.filter(r=>r.producto==='MAGNA').reduce((a,r)=>a+(r.litros||0),0),0);
  const totalDiesel = tarjetas.reduce((s,b)=>s+b.rows.filter(r=>r.producto==='DIESEL').reduce((a,r)=>a+(r.litros||0),0),0);
  const totalKm     = tarjetas.reduce((s,b)=>s+b.rows.reduce((a,r)=>a+(r.distancia||0),0),0);
  const totalCargas = tarjetas.reduce((s,b)=>s+b.rows.length,0);
  const totalLitros = totalMagna+totalDiesel;
  const mesNombre   = MESES_N[DATOS.mes]||'';
  const folio       = 'SPR-'+DATOS.anio+String(DATOS.mes).padStart(2,'0')+'-000';

  const filas = tarjetas.map((b,i)=>{
    const litros  = b.rows.reduce((s,r)=>s+(r.litros||0),0);
    const magna   = b.rows.filter(r=>r.producto==='MAGNA').reduce((s,r)=>s+(r.litros||0),0);
    const diesel  = b.rows.filter(r=>r.producto==='DIESEL').reduce((s,r)=>s+(r.litros||0),0);
    const km      = b.rows.reduce((s,r)=>s+(r.distancia||0),0);
    const pct     = totalLitros>0?(litros/totalLitros*100):0;
    const rend    = b.rows.filter(r=>r.rendimiento>0);
    const avgRend = rend.length?rend.reduce((s,r)=>s+r.rendimiento,0)/rend.length:0;
    const pctConsumo = b.montoAutorizado>0?(litros/b.montoAutorizado*100):null;
    const pctCol  = pctConsumo===null?'#888':pctConsumo>100?'#1e5b4f':pctConsumo>=80?'#e67e22':'#27ae60';
    return `<tr>
      <td style="text-align:center;font-weight:700;color:#1e5b4f;">${i+1}</td>
      <td>
        <div style="font-weight:700;font-size:0.72rem;color:#222;">${b.usuario||'—'}</div>
        <div style="font-size:0.62rem;color:#888;">${b.tarjeta} · ${b.placa||'—'}</div>
      </td>
      <td style="font-size:0.68rem;color:#555;">${b.area||'—'}</td>
      <td style="text-align:center;">
        <span style="background:${b.producto==='MAGNA'?'#e8f5e9':'#e3f2fd'};
          color:${b.producto==='MAGNA'?'#2e7d32':'#1565c0'};
          border-radius:4px;padding:1px 6px;font-size:0.62rem;font-weight:700;">
          ${b.producto||'—'}
        </span>
      </td>
      <td style="text-align:right;font-variant-numeric:tabular-nums;font-size:0.7rem;">
        ${magna>0?`<span style="color:#2e7d32;font-weight:600;">${fmt(magna)} L</span>`:'—'}
      </td>
      <td style="text-align:right;font-variant-numeric:tabular-nums;font-size:0.7rem;">
        ${diesel>0?`<span style="color:#1565c0;font-weight:600;">${fmt(diesel)} L</span>`:'—'}
      </td>
      <td style="text-align:right;font-weight:800;font-size:0.75rem;color:#1e5b4f;">${fmt(litros)} L</td>
      <td style="text-align:right;font-size:0.7rem;color:#666;">${km>0?fmtI(km)+' km':'—'}</td>
      <td style="text-align:right;font-size:0.7rem;color:#666;">${avgRend>0?avgRend.toFixed(2)+' km/L':'—'}</td>
      <td style="text-align:right;">
        <span style="font-size:0.68rem;font-weight:700;color:${pctCol};">
          ${pctConsumo!==null?pctConsumo.toFixed(1)+'%':'—'}
        </span>
      </td>
      <td style="text-align:center;">
        <div style="background:#e8f5f0;border-radius:4px;padding:1px 6px;
          font-size:0.62rem;color:#1e5b4f;font-weight:600;">${b.rows.length}</div>
      </td>
    </tr>`;
  }).join('');

  return `<div class="rpt-page" style="padding:36px 40px;">

    <!-- ENCABEZADO PORTADA -->
    <div class="rpt-header">

// ── Página individual por tarjeta ───────────────────────────────────────
function buildPagina(b, idx, total, now) {
  const rows         = b.rows;
  const totalLitros  = rows.reduce((s,r)=>s+(r.litros||0),0);
  const totalDist    = rows.reduce((s,r)=>s+(r.distancia||0),0);
  const rendRows     = rows.filter(r=>r.rendimiento>0);
  const avgRend      = rendRows.length ? rendRows.reduce((s,r)=>s+r.rendimiento,0)/rendRows.length : 0;
  const pctConsumo   = b.montoAutorizado>0 ? (totalLitros/b.montoAutorizado*100) : null;
  const folio        = 'SRP-'+DATOS.anio+String(DATOS.mes).padStart(2,'0')+'-'+String(idx+1).padStart(3,'0');
  const esPickup     = PICKUP.some(t => b.tipoVehiculo.toUpperCase().includes(t) || b.clasificacion.toUpperCase().includes(t));
  const fechaEmision = now.toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'});

  // Color KPI % consumo
  const pctCol = pctConsumo===null ? 'k-gris'
    : pctConsumo > 100 ? 'k-verde'
    : pctConsumo >= 80 ? 'k-naranja'
    : 'k-verde';
  const pctLabel = pctConsumo===null ? '—'
    : pctConsumo > 100 ? '📋 Dispersión autori.'
    : 'del autorizado';

  // Tabla de cargas
  const tablaRows = rows.map((r,i) => {
    const estCve = String(r.estacion||'').trim().replace(/\.0$/,'').replace(/^E0*/,'');
    const estNom = EST_NOM[estCve] || estCve || '—';
    const prod   = String(r.producto||'').toUpperCase();
    return `<tr>
      <td>${i+1}</td>
      <td>${String(r.fecha||'').substring(0,10)}</td>
      <td>${String(r.hora||'').substring(0,5)}</td>
      <td>${estNom}</td>
      <td><span class="tag ${prod==='MAGNA'?'magna':'diesel'}">${prod||'—'}</span></td>
      <td class="r">${fmt(r.litros||0)} L</td>
      <td class="r">${r.rendimiento>0 ? r.rendimiento.toFixed(2)+' km/L' : '—'}</td>
      <td class="r">${fmtI(r.odometroInicial||0)}</td>
      <td class="r">${fmtI(r.distancia||0)} km</td>
    </tr>`;
  }).join('');

  // Gráfica rendimiento + calificación benchmark (solo pickup/semipesado)
  let graficaHTML = '';
  if (esPickup && avgRend > 0) {
    const bench = getBench(b);
    const calif = calcCalificacion(avgRend, bench);
    const rendPorDia = {};
    rows.forEach(r => {
      const f = String(r.fecha||'').split('T')[0];
      const p = f.includes('-') ? f.split('-') : f.split('/').reverse();
      const d = parseInt(p[2]||0);
      if (d>0 && r.rendimiento>0) {
        if (!rendPorDia[d]) rendPorDia[d]=[];
        rendPorDia[d].push(r.rendimiento);
      }
    });
    const dias   = Object.keys(rendPorDia).map(Number).sort((a,b)=>a-b);
    const rVals  = dias.map(d => rendPorDia[d].reduce((s,v)=>s+v,0)/rendPorDia[d].length);
    const maxR   = Math.max(...rVals, 1);

    if (dias.length > 0) {
      const bars = dias.map((d,di) => {
        const hpct = Math.max(4, (rVals[di]/maxR*100));
        const col  = rVals[di]>=10 ? '#27ae60' : rVals[di]>=6 ? '#e67e22' : '#c0392b';
        return `<div class="rpt-bar-col">
          <div class="rpt-bar-val" style="color:${col}">${rVals[di].toFixed(1)}</div>
          <div class="rpt-bar" style="height:${hpct}%;background:${col};"></div>
          <div class="rpt-bar-dia">${d}</div>
        </div>`;
      }).join('');

      graficaHTML = `
        <div class="rpt-section-title">
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
          Rendimiento Diario del Mes (km/L) — Evaluación
        </div>
        <div class="rpt-grafica-wrap">
          <div class="rpt-bars-wrap">${bars}</div>
          <div class="rpt-avg-line">
            <span class="rpt-avg-label">── Promedio: ${avgRend.toFixed(2)} km/L</span>
            <div class="rpt-legend">
              <span><span style="color:#27ae60">●</span> Óptimo ≥10</span>
              <span><span style="color:#e67e22">●</span> Regular ≥6</span>
              <span><span style="color:#c0392b">●</span> Bajo &lt;6</span>
            </div>
          </div>
        </div>
        ${calif ? `
        <div style="display:grid;grid-template-columns:1fr 2fr;gap:12px;margin-bottom:16px;">
          <!-- Calificación -->
          <div style="background:#f8fbf9;border:1.5px solid ${calif.color}44;border-radius:10px;
            padding:14px;text-align:center;border-top:3px solid ${calif.color};">
            <div style="font-size:0.6rem;text-transform:uppercase;letter-spacing:0.08em;
              color:#888;font-weight:700;margin-bottom:6px;">Calificación Benchmark</div>
            <div style="font-family:'Barlow Condensed',sans-serif;font-size:2.8rem;
              font-weight:900;color:${calif.color};line-height:1;">${calif.pts}</div>
            <div style="font-size:0.62rem;color:#aaa;margin-bottom:6px;">/100 puntos</div>
            <div style="background:${calif.color};color:#fff;border-radius:5px;
              padding:3px 10px;font-family:'Barlow Condensed',sans-serif;
              font-size:0.82rem;font-weight:800;display:inline-block;">
              ${calif.nivel}
            </div>
          </div>
          <!-- Detalle benchmark -->
          <div style="background:#f8fbf9;border:1.5px solid var(--border);border-radius:10px;padding:14px;">
            <div style="font-size:0.6rem;text-transform:uppercase;letter-spacing:0.08em;
              color:#888;font-weight:700;margin-bottom:8px;">Rango de Referencia PEMEX</div>
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
              <!-- Barra de rango -->
              <div style="flex:1;height:10px;background:#e0e8e4;border-radius:5px;position:relative;overflow:visible;">
                <div style="position:absolute;left:0;top:0;height:100%;
                  width:100%;background:linear-gradient(90deg,#c0392b,#e67e22,#27ae60);
                  border-radius:5px;opacity:0.3;"></div>
                <!-- Marcador rendimiento actual -->
                <div style="position:absolute;top:-4px;
                  left:${Math.min(100,Math.max(0,(avgRend-calif.min*0.7)/((calif.max*1.2)-(calif.min*0.7))*100)).toFixed(0)}%;
                  transform:translateX(-50%);
                  width:18px;height:18px;border-radius:50%;
                  background:${calif.color};border:2px solid #fff;
                  box-shadow:0 2px 6px rgba(0,0,0,0.25);">
                </div>
              </div>
            </div>
            <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
              <div style="text-align:center;">
                <div style="font-size:0.58rem;color:#aaa;">Mínimo</div>
                <div style="font-family:'Barlow Condensed',sans-serif;font-size:0.95rem;
                  font-weight:800;color:#c0392b;">${calif.min} km/L</div>
              </div>
              <div style="text-align:center;">
                <div style="font-size:0.58rem;color:#aaa;">Promedio actual</div>
                <div style="font-family:'Barlow Condensed',sans-serif;font-size:0.95rem;
                  font-weight:800;color:${calif.color};">${avgRend.toFixed(2)} km/L</div>
              </div>
              <div style="text-align:center;">
                <div style="font-size:0.58rem;color:#aaa;">Máximo</div>
                <div style="font-family:'Barlow Condensed',sans-serif;font-size:0.95rem;
                  font-weight:800;color:#27ae60;">${calif.max} km/L</div>
              </div>
            </div>
            <div style="font-size:0.62rem;color:#888;line-height:1.4;border-top:1px solid var(--border);padding-top:6px;">
              ${avgRend >= calif.min && avgRend <= calif.max
                ? '✅ Rendimiento dentro del rango esperado para este tipo de unidad en operación PEMEX.'
                : avgRend > calif.max
                ? '⭐ Rendimiento superior al rango de referencia. Excelente condición mecánica.'
                : '⚠️ Rendimiento por debajo del mínimo esperado. Diagnóstico preventivo recomendado.'}
            </div>
          </div>
        </div>` : ''}`;
    }
  }

  return `<div class="rpt-page">

    <!-- ENCABEZADO -->
    <div class="rpt-header">
      <div class="rpt-header-left">
        <div class="rpt-header-logo">

// ── Generar PDF ────────────────────────────────────────────────────────
async function generarPDF() {
  const { jsPDF } = window.jspdf;
  const now        = new Date();
  const tarjetas   = DATOS.tarjetas;
  const wrap       = document.getElementById('renderWrap');
  const pdf        = new jsPDF({orientation:'portrait', unit:'px', format:'letter', hotfixes:['px_scaling']});
  const PW         = pdf.internal.pageSize.getWidth();
  const PH         = pdf.internal.pageSize.getHeight();

  // ── PORTADA: Resumen consolidado de todas las tarjetas ────────────────
  setProgreso(5, 'Generando portada…');
  // Obtener logo del DOM (ya está renderizado en buildPagina)
  const LOGO_SRC = document.querySelector('#renderWrap img')?.src || '';
  wrap.innerHTML = buildPortada(tarjetas, now, LOGO_SRC);
  await new Promise(r => setTimeout(r, 300));
  const portadaEl     = wrap.firstElementChild;
  const portadaCanvas = await html2canvas(portadaEl, {
    scale:2, useCORS:true, allowTaint:false,
    backgroundColor:'#ffffff', logging:false, width:816
  });
  const portadaImg = portadaCanvas.toDataURL('image/jpeg', 0.95);
  const portadaH   = portadaCanvas.height * (PW / portadaCanvas.width);
  pdf.addImage(portadaImg, 'JPEG', 0, 0, PW, portadaH);

  for (let i=0; i<tarjetas.length; i++) {
    const b = tarjetas[i];
    setProgreso(10 + Math.round(i/tarjetas.length*85),
      `Procesando ${i+1} de ${tarjetas.length}: ${b.usuario||b.tarjeta}…`);

    // Renderizar página en el DOM
    wrap.innerHTML = buildPagina(b, i, tarjetas.length, now);
    await new Promise(r => setTimeout(r, 250));

    // Capturar con html2canvas
    const el = wrap.firstElementChild;
    const canvas = await html2canvas(el, {
      scale: 2,
      useCORS: true,
      allowTaint: false,
      backgroundColor: '#ffffff',
      logging: false,
      width: 816
    });

    // Insertar en PDF
    if (i > 0) pdf.addPage();
    const imgData = canvas.toDataURL('image/jpeg', 0.95);
    const ratio   = PH / canvas.height * canvas.width / canvas.width;
    const imgW    = PW;
    const imgH    = canvas.height * (PW / canvas.width);

    // Si la imagen es más alta que la página, escalar
    if (imgH <= PH) {
      pdf.addImage(imgData, 'JPEG', 0, 0, imgW, imgH);
    } else {
      // Paginar si hay muchas cargas
      let posY = 0;
      while (posY < canvas.height) {
        const sliceH  = Math.min(Math.ceil(canvas.height * PH / imgH), canvas.height - posY);
        const sliceC  = document.createElement('canvas');
        sliceC.width  = canvas.width;
        sliceC.height = sliceH;
        sliceC.getContext('2d').drawImage(canvas, 0, posY, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
        if (posY > 0) pdf.addPage();
        pdf.addImage(sliceC.toDataURL('image/jpeg',0.95), 'JPEG', 0, 0, imgW, sliceH*(PW/canvas.width));
        posY += sliceH;
      }
    }
  }

  wrap.innerHTML = '';
  setProgreso(100, `✅ Listo — ${tarjetas.length} tarjeta${tarjetas.length!==1?'s':''} procesadas`);

  // Guardar blob para descarga
  pdfBlob = pdf.output('blob');

  // Descargar automáticamente
  const areaLabel = (DATOS.area||'Area').replace(/\s+/g,'_');
  const nombrePDF = `SuperReporte_${areaLabel}_${MESES_N[DATOS.mes]||DATOS.mes}_${DATOS.anio}.pdf`;
  const url = URL.createObjectURL(pdfBlob);
  const a   = document.createElement('a');
  a.href = url; a.download = nombrePDF;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);

  // Mostrar botones
  const btnD = document.getElementById('btnDescargar');
  const btnC = document.getElementById('btnCerrar');
  btnD.style.display = 'inline-flex';
  btnC.style.display = 'inline-block';

  // Limpiar localStorage
  localStorage.removeItem('SACISC_SUPER_RPT');
}

function descargarPDF() {
  if (!pdfBlob) return;
  const areaLabel = (DATOS?.area||'Area').replace(/\s+/g,'_');
  const url = URL.createObjectURL(pdfBlob);
  const a   = document.createElement('a');
  a.href = url;
  a.download = `SuperReporte_${areaLabel}_${MESES_N[DATOS?.mes]||''}_${DATOS?.anio||''}.pdf`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
